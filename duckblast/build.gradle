plugins {
    id 'com.android.application'
}

android {
    namespace 'app.duckblast'
    compileSdk 35

    defaultConfig {
        applicationId 'app.duckblast'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Same personal key as Claude TV so CI builds install over each other.
    signingConfigs {
        personal {
            storeFile rootProject.file('keystore/claudetv.keystore')
            storePassword 'claudetv'
            keyAlias 'claudetv'
            keyPassword 'claudetv'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
        debug {
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
